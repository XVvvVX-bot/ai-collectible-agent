[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-collectibles-agent"
version = "0.1.0"
description = "AI Collectibles Intelligence Agent (Zhaoonline-first, multi-source-ready)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AI Agent Team" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

